name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate-build:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test Build API
        run: docker build -t test-api ./services/api

      - name: Test Build Caddy
        run: docker build -t test-caddy ./caddy