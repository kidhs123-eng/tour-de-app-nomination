<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tour de App</title>
</head>
<body>
    <div id="status-container">Loading...</div>

    <script>
        fetch('/api/v1/health')
            .then(response => response.json())
            .then(data => {
                document.getElementById('status-container').textContent = data.status;
            })
            .catch(err => console.error(err));
    </script>
</body>
</html>
